<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
    
    /* Dynamic Wave Animations */
    @keyframes waveFloat1 {
      0% { transform: translateY(0px) scaleY(1); }
      50% { transform: translateY(-12px) scaleY(1.05); }
      100% { transform: translateY(0px) scaleY(1); }
    }
    @keyframes waveFloat2 {
      0% { transform: translateY(0px) scaleY(1); }
      50% { transform: translateY(10px) scaleY(0.95); }
      100% { transform: translateY(0px) scaleY(1); }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.3; }
      50% { opacity: 0.7; }
      100% { opacity: 0.3; }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -40; }
    }

    .wave1 { animation: waveFloat1 8s ease-in-out infinite; opacity: 0.25; }
    .wave2 { animation: waveFloat2 10s ease-in-out infinite; opacity: 0.2; }
    .glow-bg { animation: pulseGlow 6s ease-in-out infinite; }
    .dashed-line { stroke-dasharray: 8 8; animation: dashMove 4s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Grid Pattern Overlay for Tech Aesthetic -->
  <g opacity="0.05">
    <path d="M0 40H1200 M0 80H1200 M0 120H1200 M0 160H1200 M0 200H1200 M0 240H1200 M0 280H1200" stroke="#ffffff" stroke-width="1"/>
    <path d="M100 0V320 M200 0V320 M300 0V320 M400 0V320 M500 0V320 M600 0V320 M700 0V320 M800 0V320 M900 0V320 M1000 0V320 M1100 0V320" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Dynamic Glowing Background Orbs (Kept safely in background) -->
  <circle cx="950" cy="100" r="180" fill="#38bdf8" class="glow-bg" filter="url(#glow)"/>
  <circle cx="1050" cy="220" r="150" fill="#818cf8" class="glow-bg" filter="url(#glow)"/>

  <!-- Dynamic Background Waves (Behind Foreground Text) -->
  <g class="wave1">
    <path d="M 0 220 Q 300 140 600 220 T 1200 220 L 1200 320 L 0 320 Z" fill="url(#accentGrad)"/>
  </g>
  <g class="wave2">
    <path d="M 0 250 Q 300 300 600 230 T 1200 260 L 1200 320 L 0 320 Z" fill="#38bdf8"/>
  </g>

  <!-- Connected Graph / Network Lines (Right side decoration) -->
  <g opacity="0.4" stroke="#818cf8" stroke-width="2">
    <line x1="800" y1="90" x2="920" y2="150" class="dashed-line"/>
    <line x1="920" y1="150" x2="1050" y2="100" class="dashed-line"/>
    <line x1="920" y1="150" x2="980" y2="230" class="dashed-line"/>
    <line x1="1050" y1="100" x2="1120" y2="180" class="dashed-line"/>
    <circle cx="800" cy="90" r="6" fill="#38bdf8"/>
    <circle cx="920" cy="150" r="8" fill="#818cf8"/>
    <circle cx="1050" cy="100" r="7" fill="#c084fc"/>
    <circle cx="980" cy="230" r="5" fill="#38bdf8"/>
    <circle cx="1120" cy="180" r="6" fill="#818cf8"/>
  </g>

  <!-- Content Container (Foreground Left Side) -->
  <!-- Category Pill -->
  <rect x="60" y="55" width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="75" y="76" class="badge-text">⚙️ ENTERPRISE IT &amp; SYSTEMS</text>

  <!-- Main Title -->
  <text x="60" y="140" class="title">IT Operations &amp; Systems Management</text>
  
  <!-- Subtitle -->
  <text x="60" y="185" class="subtitle">Curated SaaS Platforms &amp; Self-Hosted Open-Source Ecosystem</text>

  <!-- Feature Pills -->
  <g transform="translate(60, 225)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="36" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="16" y="23" font-family="sans-serif" font-size="14" fill="#e2e8f0" font-weight="600">💻 Endpoint Control</text>

    <!-- Pill 2 -->
    <rect x="175" y="0" width="160" height="36" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="191" y="23" font-family="sans-serif" font-size="14" fill="#e2e8f0" font-weight="600">🛡️ Patch Automation</text>

    <!-- Pill 3 -->
    <rect x="350" y="0" width="165" height="36" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="366" y="23" font-family="sans-serif" font-size="14" fill="#e2e8f0" font-weight="600">📊 Cloud Observability</text>
  </g>

  <!-- Top Border Highlight Line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGrad)" rx="2"/>
</svg>
