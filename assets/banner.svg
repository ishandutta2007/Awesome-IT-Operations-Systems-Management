roke-width="1" rx="8"/><text x="366" y="23" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="600">📊 Cloud Observability</text></g><rect width="1200" height="4" x="0" y="0" fill="url(#accentGrad)" rx="2"/></svg>