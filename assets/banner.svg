<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e293b"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes waveFloat1{0%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-12px) scaleY(1.05)}}@keyframes waveFloat2{0%{transform:translateY(0) scaleY(1)}50%{transform:translateY(10px) scaleY(.95)}}@keyframes pulseGlow{0%{opacity:.3}50%{opacity:.7}}@keyframes dashMove{0%{stroke-dashoffset:0}}.badge-text,.subtitle,.title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:42px;fill:#fff}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#38bdf8}.wave1{animation:waveFloat1 8s ease-in-out infinite;opacity:.25}.wave2{animation:waveFloat2 10s ease-in-out infinite;opacity:.2}.glow-bg{animation:pulseGlow 6s ease-in-out infinite}.dashed-line{stroke-dasharray:8 8;animation:dashMove 4s linear infinite}</style><rect width="1200" height="320" fill="url(#bgGrad)" rx="16"/><g opacity=".05"><path stroke="#fff" stroke-width="1" d="M0 40H1200 M0 80H1200 M0 120H1200 M0 160H1200 M0 200H1200 M0 240H1200 M0 280H1200"/><path stroke="#fff" stroke-width="1" d="M100 0V3